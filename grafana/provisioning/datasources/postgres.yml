apiVersion: 1
datasources:
  - name: MTC Postgres
    uid: mtc-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: ${POSTGRES_USER}
    isDefault: true
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
