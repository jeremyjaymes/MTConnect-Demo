apiVersion: 1
groups:
  - orgId: 1
    name: machine-conditions
    folder: MTConnect
    interval: 1m
    rules:
      - uid: mtc-fault-recent
        title: Machine fault in the last 5 minutes
        condition: C
        for: 0s
        noDataState: OK        # no fault rows means nothing to alert on
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} reported a fault in the last 5 minutes"
          description: "See the 'Condition history' panel on the Machine utilization dashboard."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: mtc-postgres
            model:
              refId: A
              datasource: {type: grafana-postgresql-datasource, uid: mtc-postgres}
              format: time_series
              rawQuery: true
              editorMode: code
              # The extra `device` column becomes an alert label. Faults here last about a second, so look at recent history, not only what is active right now.
              rawSql: >
                SELECT now() AS time, device, COUNT(*)::float AS value
                FROM condition_intervals
                WHERE level = 'FAULT' AND start_ts > now() - interval '5 minutes'
                GROUP BY device
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
              datasource: {type: __expr__, uid: __expr__}
